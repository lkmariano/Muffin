<!DOCTYPE html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <!-- Marks JS as available before first paint so the burger drawer never
         flashes; without JS the nav simply stays inline. -->
    <script>document.documentElement.classList.add('js');</script>
    {{SITE_DESCRIPTION}}
    <link rel="stylesheet" href="{{CSS}}">
    {{KATEX_CSS}}
    {{RSS_LINK}}
  </head>
  <body {{BODY_ATTRS}}>
    <header class="topbar">
      <button type="button" class="burger" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <svg class="icon-open" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16"/></svg>
        <svg class="icon-close" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 5l12 12M17 5L5 17"/></svg>
      </button>
      <span class="topbar-title">{{SITE_TITLE}}</span>
    </header>
    <div class="backdrop" id="nav-backdrop"></div>

    <div class="page">
      <nav id="site-nav" aria-label="Site navigation">
        <div class="site-title">{{SITE_TITLE}}</div>
        <div class="nav-links">
          <button type="button" class="explorer-header" id="explorer-toggle-all" aria-expanded="true" aria-controls="explorer-content">
            <span class="explorer-title">Explorer</span>
            <span class="explorer-header-chevron">
              <svg class="chevron" viewBox="0 0 12.5 6.25" aria-hidden="true"><path d="M0.5 0.5 L6.25 5.75 L12 0.5"/></svg>
            </span>
          </button>
          <div class="explorer-content" id="explorer-content">{{NAV}}</div>
        </div>
        <footer>Generated by Muffin</footer>
      </nav>
      <main>
        <div class="content">
          <h1>{{TITLE}}</h1>
            {{PAGE_META}}
            {{CONTENT}}
        </div>
      </main>
      <aside>
        {{TOC}}
        {{BACKLINKS}}
      </aside>
    </div>
    <!-- Current-page highlighting is server-rendered at build time via the
         page's canonical data-relpath; no client script is required for it. -->
    <script>
      (function () {
        'use strict';
        var content = document.getElementById('explorer-content');
        var toggle = document.getElementById('explorer-toggle-all');
        if (!content || !toggle) return;

        var reduceMotion = !!(window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        var DURATION = 200;

        /* Animated disclosure: every <details> in the Explorer and the TOC
           goes through this. Respects prefers-reduced-motion (snaps) and
           falls back to a plain toggle where Element.animate is unavailable
           (jsdom, older browsers). Only user-driven toggles animate;
           restoring saved state snaps so it doesn't replay per page load. */
        function animatedDetails(details) {
          var summary = details.querySelector(':scope > summary');
          if (!summary) return null;
          var anim = null;

          function openHeight() {
            var after = summary.nextElementSibling;
            return summary.offsetHeight + (after ? after.offsetHeight : 0);
          }
          function run(from, to, after) {
            if (anim) anim.cancel();
            details.style.overflow = 'hidden';
            anim = details.animate(
              { height: [from + 'px', to + 'px'] },
              { duration: DURATION, easing: 'ease-out' }
            );
            anim.onfinish = function () {
              details.style.height = '';
              details.style.overflow = '';
              anim = null;
              after();
            };
          }
          function close(onDone) {
            if (!details.open) { if (onDone) onDone(); return; }
            if (reduceMotion || !details.animate) {
              details.open = false;
              if (onDone) onDone();
              return;
            }
            run(details.offsetHeight, summary.offsetHeight, function () {
              details.open = false;
              if (onDone) onDone();
            });
          }
          function open(onDone) {
            if (details.open) { if (onDone) onDone(); return; }
            if (reduceMotion || !details.animate) {
              details.open = true;
              if (onDone) onDone();
              return;
            }
            var from = details.offsetHeight;
            details.open = true;
            run(from, openHeight(), onDone || function () {});
          }

          summary.addEventListener('click', function (e) {
            e.preventDefault();
            if (details.open) close(); else open();
          });

          return { open: open, close: close };
        }

        var controllers = new Map();
        Array.prototype.forEach.call(
          document.querySelectorAll('nav details, aside .toc > details'),
          function (details) {
            var c = animatedDetails(details);
            if (c) controllers.set(details, c);
          }
        );

        function storageKey() {
          var basePath = document.body && document.body.getAttribute('data-base-path');
          return 'muffin:explorer:v1:' + (basePath || '/');
        }
        function read() {
          try {
            var raw = window.localStorage.getItem(storageKey());
            return raw ? JSON.parse(raw) : null;
          } catch (e) { return null; }
        }
        function write(state) {
          try { window.localStorage.setItem(storageKey(), JSON.stringify(state)); }
          catch (e) { /* storage unavailable — Explorer still works */ }
        }

        var state = read() || { folders: {} };
        var folders = state.folders || {};
        var details = Array.prototype.slice.call(
          content.querySelectorAll('details[data-folder-path]')
        );

        details.forEach(function (detail) {
          var key = detail.getAttribute('data-folder-path');
          if (!key) return;
          if (Object.prototype.hasOwnProperty.call(folders, key)) {
            detail.open = !!folders[key];
          }
          detail.addEventListener('toggle', function () {
            if (!key) return;
            folders[key] = detail.open;
            reflect();
            save();
          });
        });

        function allFoldersOpen() {
          return details.every(function (detail) { return detail.open; });
        }
        function reflect() {
          toggle.setAttribute('aria-expanded', String(allFoldersOpen()));
        }
        function save() {
          write({ folders: folders });
        }

        toggle.addEventListener('click', function () {
          if (details.length === 0) { reflect(); return; }
          var opening = !allFoldersOpen();
          var remaining = details.length;
          details.forEach(function (detail) {
            var key = detail.getAttribute('data-folder-path');
            var c = controllers.get(detail);
            var done = function () {
              if (key) folders[key] = detail.open;
              remaining -= 1;
              if (remaining === 0) { reflect(); save(); }
            };
            if (c) { if (opening) c.open(done); else c.close(done); }
            else { detail.open = opening; done(); }
          });
        });

        reflect();
      })();
    </script>
    <!-- Burger drawer -->
    <script>
      (function () {
        'use strict';
        var btn = document.getElementById('nav-toggle');
        var nav = document.getElementById('site-nav');
        var backdrop = document.getElementById('nav-backdrop');
        if (!btn || !nav || !backdrop) return;
        if (!window.matchMedia) return;

        var mq = window.matchMedia('(max-width: 899px)');

        function setOpen(open) {
          nav.classList.toggle('is-open', open);
          backdrop.classList.toggle('is-open', open);
          btn.setAttribute('aria-expanded', String(open));
          document.body.classList.toggle('nav-locked', open);
          if (open) {
            var first = nav.querySelector('button, a[href], summary');
            if (first) first.focus();
          }
        }
        function isOpen() { return nav.classList.contains('is-open'); }

        btn.addEventListener('click', function () { setOpen(!isOpen()); });
        backdrop.addEventListener('click', function () { setOpen(false); });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && isOpen()) { setOpen(false); btn.focus(); }
        });
        // Navigating to another note closes the drawer.
        nav.addEventListener('click', function (e) {
          var a = e.target.closest ? e.target.closest('a[href]') : null;
          if (a) setOpen(false);
        });
        // Resizing up to desktop must not leave the page scroll-locked.
        var onChange = function () { if (!mq.matches) setOpen(false); };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
      })();
    </script>
    <!-- TOC scroll-spy: headings you've scrolled through are 100%, the rest 50% -->
    <script>
      (function () {
        'use strict';
        var list = document.querySelector('.toc-list');
        if (!list) return;

        var items = [];
        var seen = Object.create(null);
        Array.prototype.forEach.call(list.querySelectorAll('a[href^="#"]'), function (link) {
          var id = (link.getAttribute('href') || '').slice(1);
          try { id = decodeURIComponent(id); } catch (e) { /* keep raw id */ }
          if (!id || seen[id]) return;
          seen[id] = true;
          var heading = document.getElementById(id);
          if (heading) items.push({ heading: heading, link: link });
        });
        if (items.length === 0) return;

        list.classList.add('has-spy'); // JS is running → dim by default

        var ticking = false;
        function update() {
          ticking = false;
          var line = window.innerHeight * 0.3; // same 30% band the old observer used
          var doc = document.documentElement;
          var scrollable = doc.scrollHeight > window.innerHeight + 2;
          var atBottom = scrollable && window.innerHeight + window.scrollY >= doc.scrollHeight - 2;

          var current = -1;
          items.forEach(function (item, i) {
            var passed = atBottom || item.heading.getBoundingClientRect().top <= line;
            item.link.classList.toggle('is-passed', passed);
            if (passed) current = i;
          });
          items.forEach(function (item, i) {
            if (i === current) item.link.setAttribute('aria-current', 'location');
            else item.link.removeAttribute('aria-current');
          });
        }
        function schedule() {
          if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
        }

        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule);
        update();
      })();
    </script>
  </body>
</html>
