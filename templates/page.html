<!DOCTYPE html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    {{SITE_DESCRIPTION}}
    <link rel="stylesheet" href="{{THEME_CSS}}">
    <link rel="stylesheet" href="{{CSS}}">
    {{KATEX_CSS}}
  </head>
  <body {{BODY_ATTRS}}>
    <div class="page">
      <nav>
        <div class="site-title">{{SITE_TITLE}}</div>
        <div class="nav-links">
          <button type="button" class="explorer-header" id="explorer-toggle-all" aria-expanded="true">
            <span class="explorer-title">Explorer</span>
            <span class="explorer-header-chevron">⌄</span>
          </button>
          <div class="explorer-content">{{NAV}}</div>
        </div>
        <footer>Generated by Muffin</footer>
      </nav>
      <main>
        <div class="content">
          <h1>{{TITLE}}</h1>
            {{PAGE_META}}
            {{CONTENT}}
        </div>
      </main>
      <aside>
        <div class="backlinks-list">
        {{BACKLINKS}}
        </div>
      </aside>
    </div>
    <script>
      (function () {
        var toggle = document.getElementById('explorer-toggle-all');
        if (!toggle) return;
        toggle.addEventListener('click', function () {
          var isExpanded = toggle.getAttribute('aria-expanded') === 'true';
          var nextState = !isExpanded;
          var allDetails = document.querySelectorAll('.explorer-content details');
          allDetails.forEach(function (d) {
            d.open = nextState;
          });
          toggle.setAttribute('aria-expanded', String(nextState));
        });
      })();
    </script>
  </body>
</html>
