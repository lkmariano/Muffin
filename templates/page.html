<!DOCTYPE html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    {{SITE_DESCRIPTION}}
    <link rel="stylesheet" href="{{THEME_CSS}}">
    <link rel="stylesheet" href="{{CSS}}">
    {{KATEX_CSS}}
  </head>
  <body {{BODY_ATTRS}}>
    <div class="page">
      <nav>
        <div class="site-title">{{SITE_TITLE}}</div>
        <div class="nav-links">
          <button type="button" class="explorer-header" id="explorer-toggle-all" aria-expanded="true" aria-controls="explorer-content">
            <span class="explorer-title">Explorer</span>
            <span class="explorer-header-chevron">
              <svg class="chevron" viewBox="0 0 12.5 6.25" aria-hidden="true"><path d="M0.5 0.5 L6.25 5.75 L12 0.5"/></svg>
            </span>
          </button>
          <div class="explorer-content" id="explorer-content">{{NAV}}</div>
        </div>
        <footer>Generated by Muffin</footer>
      </nav>
      <main>
        <div class="content">
          <h1>{{TITLE}}</h1>
            {{PAGE_META}}
            {{CONTENT}}
        </div>
      </main>
      <aside>
        {{TOC}}
        {{BACKLINKS}}
      </aside>
    </div>
    <!-- Current-page highlighting is server-rendered at build time via the
         page's canonical data-relpath; no client script is required for it. -->
    <script>
      (function () {
        'use strict';
        var content = document.getElementById('explorer-content');
        var toggle = document.getElementById('explorer-toggle-all');
        if (!content || !toggle) return;

        function storageKey() {
          var basePath = document.body && document.body.getAttribute('data-base-path');
          return 'muffin:explorer:v1:' + (basePath || '/');
        }
        function read() {
          try {
            var raw = window.localStorage.getItem(storageKey());
            return raw ? JSON.parse(raw) : null;
          } catch (e) { return null; }
        }
        function write(state) {
          try { window.localStorage.setItem(storageKey(), JSON.stringify(state)); }
          catch (e) { /* storage unavailable — Explorer still works */ }
        }

        var state = read() || { folders: {} };
        var folders = state.folders || {};
        var details = Array.prototype.slice.call(
          content.querySelectorAll('details[data-folder-path]')
        );

        details.forEach(function (detail) {
          var key = detail.getAttribute('data-folder-path');
          if (!key) return;
          if (Object.prototype.hasOwnProperty.call(folders, key)) {
            detail.open = !!folders[key];
          }
          detail.addEventListener('toggle', function () {
            folders[key] = detail.open;
            save();
            reflect();
          });
        });

        if (Object.prototype.hasOwnProperty.call(state, 'mobileCollapsed') &&
            state.mobileCollapsed) {
          content.classList.add('explorer-collapsed');
        }

        function isMobile() {
          return !!(window.matchMedia &&
            window.matchMedia('(max-width: 699px)').matches);
        }
        function allFoldersOpen() {
          return details.every(function (detail) { return detail.open; });
        }
        function isCollapsed() {
          return content.classList.contains('explorer-collapsed');
        }
        function reflect() {
          toggle.setAttribute(
            'aria-expanded',
            String(isMobile() ? !isCollapsed() : allFoldersOpen())
          );
        }
        function save() {
          write({ folders: folders, mobileCollapsed: isCollapsed() });
        }

        toggle.addEventListener('click', function () {
          if (isMobile()) {
            content.classList.toggle('explorer-collapsed');
            save();
            reflect();
            return;
          }
          var next = !allFoldersOpen();
          details.forEach(function (detail) {
            var key = detail.getAttribute('data-folder-path');
            detail.open = next;
            if (key) folders[key] = next;
          });
          save();
          reflect();
        });

        if (window.matchMedia) {
          var query = window.matchMedia('(max-width: 699px)');
          var onChange = function () { reflect(); };
          if (typeof query.addEventListener === 'function') {
            query.addEventListener('change', onChange);
          } else if (typeof query.addListener === 'function') {
            query.addListener(onChange);
          }
        }
        reflect();
      })();
    </script>
    <script>
      (function () {
        'use strict';
        var list = document.querySelector('.toc-list');
        if (!list || typeof window.IntersectionObserver === 'undefined') return;

        var entries = [];
        var bandState = new Map();
        var seen = Object.create(null);
        Array.prototype.forEach.call(
          list.querySelectorAll('a[href^="#"]'),
          function (link) {
            var href = link.getAttribute('href') || '';
            var id = href.slice(1);
            if (!id || seen[id]) return;
            seen[id] = true;
            var heading = document.getElementById(id);
            if (!heading) return;
            entries.push({ heading: heading, link: link });
            bandState.set(heading, false);
          }
        );
        if (entries.length === 0) return;

        var lastEntry = entries[entries.length - 1];
        var lastVisible = false;

        function clear() {
          entries.forEach(function (entry) {
            entry.link.classList.remove('is-active');
          });
          list.classList.remove('has-active');
        }
        function activate(heading) {
          entries.forEach(function (entry) {
            entry.link.classList.toggle('is-active', entry.heading === heading);
          });
          list.classList.add('has-active');
        }
        function recompute() {
          var best = null;
          var bestTop = Infinity;
          bandState.forEach(function (inBand, heading) {
            if (!inBand) return;
            var top = heading.getBoundingClientRect().top;
            if (top < bestTop) { bestTop = top; best = heading; }
          });
          if (best) { activate(best); return; }
          if (lastVisible) { activate(lastEntry.heading); return; }
          clear();
        }

        var bandObserver = new window.IntersectionObserver(function (entriesList) {
          entriesList.forEach(function (entry) {
            bandState.set(entry.target, entry.isIntersecting);
          });
          recompute();
        }, { rootMargin: '0px 0px -70% 0px' });

        var lastObserver = new window.IntersectionObserver(function (entriesList) {
          entriesList.forEach(function (entry) {
            if (entry.target === lastEntry.heading) {
              lastVisible = entry.isIntersecting;
            }
          });
          recompute();
        });

        entries.forEach(function (entry) {
          bandObserver.observe(entry.heading);
        });
        lastObserver.observe(lastEntry.heading);
      })();
    </script>
  </body>
</html>
